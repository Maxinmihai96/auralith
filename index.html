<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0a0820">
<title>Auralith</title>
<meta name="apple-mobile-web-app-title" content="Auralith">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: playful, luminous, premium mobile puzzle
   IDEA: crystal gems shattering under a night aurora
   PICTURE: the 8x8 gem board itself, glowing on a living aurora sky
   COLOUR and TYPE: deep night base, aurora fields per world, gem jewel tones, gold accent; Fredoka
   LAYOUT: HUD top, board centre, tray below, power-ups at the bottom; one column, safe areas */
:root{color-scheme:dark;--a1:#3b1d7a;--a2:#0b6b7a;--a3:#7a1d5c;--base:#0a0820;--ink:#f4f1ff;--gold:#ffd66b;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom)}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--base);color:var(--ink);font:16px/1.4 Fredoka,system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer}
#sky{position:fixed;inset:-25%;background:radial-gradient(38% 30% at 22% 28%,var(--a1),transparent 70%),radial-gradient(42% 34% at 78% 22%,var(--a2),transparent 70%),radial-gradient(55% 40% at 50% 92%,var(--a3),transparent 72%),var(--base);animation:drift 16s ease-in-out infinite alternate;transition:background .8s}
@keyframes drift{to{transform:translate(5%,-4%) rotate(7deg) scale(1.1)}}
body.fever #sky{animation:drift 16s ease-in-out infinite alternate,hue 9s linear infinite}
@keyframes hue{from{filter:hue-rotate(0) saturate(1.3)}to{filter:hue-rotate(360deg) saturate(1.3)}}
#stars{position:fixed;left:0;top:0;width:2px;height:2px;border-radius:50%;animation:tw 4s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.35}}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:calc(var(--st) + 10px) 16px calc(var(--sb) + 12px)}
.screen.on{display:flex}
/* HOME */
#home{align-items:center;justify-content:center;gap:clamp(18px,4vh,34px);text-align:center}
.logo{display:flex;flex-direction:column;align-items:center;gap:6px}
.tiles{display:flex;gap:8px}
.tiles span{width:clamp(48px,14vw,66px);aspect-ratio:1;border-radius:20%;display:grid;place-items:center;font:700 clamp(34px,10vw,48px) Fredoka,system-ui,sans-serif;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.25);background:linear-gradient(135deg,var(--l),var(--m) 50%,var(--d));box-shadow:inset 0 3px 0 rgba(255,255,255,.45),inset 0 -5px 0 rgba(0,0,0,.2),0 8px 0 var(--d),0 0 30px var(--m);animation:bob 2.6s ease-in-out infinite;position:relative}
.tiles span::after{content:"";position:absolute;left:16%;top:10%;width:42%;height:18%;border-radius:50%;background:rgba(255,255,255,.55);transform:rotate(-25deg)}
.tiles span:nth-child(2){animation-delay:.2s}.tiles span:nth-child(3){animation-delay:.4s}.tiles span:nth-child(4){animation-delay:.6s}
@keyframes bob{50%{transform:translateY(-8px) rotate(-3deg)}}
.word{font:700 clamp(40px,12vw,62px)/1 Fredoka,system-ui,sans-serif;letter-spacing:.04em;background:linear-gradient(#fff,#ffe7a3 55%,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 5px 0 #4b1d8a) drop-shadow(0 0 24px rgba(255,200,110,.45));margin-top:8px}
.tag{opacity:.8;font-size:17px;margin:0}
.menu{display:flex;flex-direction:column;gap:16px;width:min(360px,100%)}
.big{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border:0;border-radius:22px;color:#fff;font:600 21px Fredoka,system-ui,sans-serif;text-align:left;background:linear-gradient(180deg,var(--b1),var(--b2));box-shadow:0 6px 0 var(--b3),0 14px 26px rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.4);transition:transform .08s}
.big:active{transform:translateY(4px);box-shadow:0 2px 0 var(--b3),0 6px 12px rgba(0,0,0,.3),inset 0 2px 0 rgba(255,255,255,.4)}
.big small{display:block;font:500 14px Fredoka,system-ui,sans-serif;opacity:.9}
.big .ic{width:46px;height:46px;flex:none;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.big .ic svg{width:28px;height:28px}
.b-j{--b1:#ffcf4d;--b2:#ff9a1f;--b3:#b35a00}.b-c{--b1:#5ab0ff;--b2:#3a6bff;--b3:#1d36a8}.b-d{--b1:#ff6fa8;--b2:#c43dff;--b3:#6a1aa0}
.row{display:flex;gap:14px;justify-content:center}
.ib{width:48px;height:48px;border-radius:16px;border:0;background:rgba(255,255,255,.12);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.2)}
.ib svg{width:24px;height:24px}
.ib:active{transform:scale(.92)}
.badge{display:inline-block;margin-left:6px;padding:1px 8px;border-radius:99px;background:rgba(0,0,0,.25);font-size:13px}
/* MAP */
#map{padding-bottom:0}
.mhead{display:flex;align-items:center;gap:12px;padding-bottom:10px}
.mhead h1{margin:0;font:700 26px Fredoka,system-ui,sans-serif;flex:1}
#mapList{flex:1;overflow-y:auto;padding-bottom:calc(var(--sb) + 24px);scrollbar-width:none}
.world{margin:0 0 18px;padding:16px;border-radius:24px;background:linear-gradient(160deg,var(--w1),var(--w2));box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 10px 30px rgba(0,0,0,.3)}
.world h2{margin:0;font:700 22px Fredoka,system-ui,sans-serif}.world p{margin:0 0 12px;opacity:.8;font-size:14px}
.lv{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.node{aspect-ratio:1;border:0;border-radius:18px;background:linear-gradient(180deg,#fff,#e8defa);color:#3a1d6e;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.3);padding:0}
.node b{font:700 20px Fredoka,system-ui,sans-serif;line-height:1}.node i{font-style:normal;font-size:11px;color:#f0a400;letter-spacing:-1px}
.node.cur{background:linear-gradient(180deg,#ffe27a,#ffab2e);color:#5a2a00;animation:pulse 1.4s ease-in-out infinite}
.node.lock{background:rgba(255,255,255,.14);color:rgba(255,255,255,.5);box-shadow:none}
@keyframes pulse{50%{transform:scale(1.08)}}
/* GAME */
#game{padding-left:10px;padding-right:10px}
.hud{display:grid;grid-template-columns:48px 1fr minmax(48px,auto);align-items:center;gap:10px}
.sc{text-align:center;line-height:1}
#score{font:700 clamp(36px,10vw,46px) Fredoka,system-ui,sans-serif;text-shadow:0 3px 0 rgba(60,20,120,.8),0 0 20px rgba(255,255,255,.25)}
#sub{font-size:14px;opacity:.8;margin-top:4px}
.goal{justify-self:end;display:flex;align-items:center;gap:6px;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.12);font:700 18px Fredoka,system-ui,sans-serif;white-space:nowrap}
.goal svg{width:22px;height:22px}
.goal.hit{animation:hit .4s}
@keyframes hit{50%{transform:scale(1.25);background:rgba(255,214,107,.4)}}
#stage{position:relative;flex:1;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#praise{position:absolute;left:0;right:0;top:30%;text-align:center;font:700 clamp(40px,12vw,60px)/1.1 Fredoka,system-ui,sans-serif;pointer-events:none;opacity:0;background:linear-gradient(#fff,#ffe08a 55%,#ff9a3d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 #4b1d8a) drop-shadow(0 0 18px rgba(255,190,90,.7))}
#praise.go{animation:pr 1.15s cubic-bezier(.2,1.3,.4,1) forwards}
#praise.bad{background:linear-gradient(#fff,#ffb3c1 55%,#ff4d6d);-webkit-background-clip:text;background-clip:text}
@keyframes pr{0%{opacity:0;transform:scale(.3) rotate(-8deg)}22%{opacity:1;transform:scale(1.12) rotate(2deg)}36%{transform:scale(1)}78%{opacity:1}100%{opacity:0;transform:translateY(-36px) scale(.92)}}
#combo{position:absolute;left:50%;top:6px;transform:translateX(-50%);padding:5px 14px;border-radius:99px;font:700 15px Fredoka,system-ui,sans-serif;background:linear-gradient(90deg,#ff5f9e,#ffb347);box-shadow:0 0 18px rgba(255,140,90,.7);opacity:0;transition:opacity .25s;white-space:nowrap;pointer-events:none}
#combo.on{opacity:1}
body.fever #combo{background:linear-gradient(90deg,#ff5f9e,#ffd66b,#5affc8,#5ab0ff,#c43dff);background-size:300% 100%;animation:sl 1.2s linear infinite}
@keyframes sl{to{background-position:300% 0}}
.pw{display:flex;justify-content:center;gap:16px;padding-top:6px}
.pb{position:relative;width:62px;height:62px;border:0;border-radius:20px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 4px 0 rgba(0,0,0,.3);display:grid;place-items:center}
.pb svg{width:32px;height:32px}
.pb:active{transform:translateY(3px)}
.pb .n{position:absolute;right:-6px;top:-6px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:#ff4d6d;font:700 14px/24px Fredoka,system-ui,sans-serif;box-shadow:0 2px 0 #a3123a}
.pb .n.z{background:#3ddc84;box-shadow:0 2px 0 #138a4a}
.pb.act{background:linear-gradient(180deg,#ff8a5c,#ff3d6e);box-shadow:0 0 22px rgba(255,80,90,.8),0 4px 0 #8a1030;animation:pulse 1s infinite}
.pb.off{opacity:.45}
/* OVERLAY */
#ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(6,4,20,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:5}
#ov.on{display:flex}
.card{width:min(380px,100%);max-height:90vh;overflow:auto;padding:24px 20px 20px;border-radius:28px;text-align:center;background:linear-gradient(170deg,#2c1a66,#170f3d);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 20px 60px rgba(0,0,0,.5);animation:in .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes in{from{transform:scale(.7);opacity:0}}
.card h2{margin:0 0 6px;font:700 30px Fredoka,system-ui,sans-serif}
.card p{margin:0 0 14px;opacity:.85}
.card .menu{margin:16px auto 0}
.card .big{justify-content:center;text-align:center;font-size:20px;padding:12px}
.ghost{background:none;border:0;padding:10px;font-size:17px;opacity:.85;width:100%}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0 10px}
.stars svg{width:56px;height:56px;opacity:.25;transform:scale(.6);transition:transform .4s cubic-bezier(.2,1.6,.4,1),opacity .3s}
.stars svg.on{opacity:1;transform:scale(1);filter:drop-shadow(0 0 10px #ffd66b)}
.stars svg:nth-child(2){transform:translateY(-10px) scale(.6)}.stars svg:nth-child(2).on{transform:translateY(-10px) scale(1.15)}
.bigsc{font:700 48px/1 Fredoka,system-ui,sans-serif;color:var(--gold);text-shadow:0 4px 0 #6a2a00;margin:6px 0}
.how{text-align:left;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.how li{display:flex;gap:12px;align-items:flex-start;font-size:16px}
.how b{flex:none;width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,#ffd66b,#ff9a1f);color:#5a2a00}
.set{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.1);font-size:18px}
.tg{width:58px;height:32px;border-radius:16px;border:0;background:rgba(255,255,255,.18);position:relative}
.tg::after{content:"";position:absolute;left:4px;top:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s}
.tg.on{background:#3ddc84}.tg.on::after{left:30px}
.chest{width:150px;margin:8px auto 4px;position:relative;cursor:pointer}.chest svg{width:100%;overflow:visible;display:block}
.chest .lid{transform-box:fill-box;transform-origin:0% 100%;transition:transform .5s cubic-bezier(.2,1.6,.4,1)}
.chest:not(.open){animation:bob 1.6s ease-in-out infinite}.chest.shake{animation:shk .12s 6}.chest.open .lid{transform:translate(-2px,-12px) rotate(-16deg)}
.chest.open::before{content:"";position:absolute;inset:-40px;background:radial-gradient(circle,rgba(255,214,107,.85),transparent 62%);animation:pulse 1.2s infinite;z-index:-1}
@keyframes shk{25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
.loot{display:flex;gap:10px;justify-content:center;min-height:86px;margin-top:8px}
.loot span{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px;border-radius:16px;background:rgba(255,255,255,.1);animation:in .45s cubic-bezier(.2,1.6,.4,1) both}
.loot svg{width:34px;height:34px}.loot b{font-size:14px}
.ths{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.th{border:0;border-radius:18px;padding:12px 8px;background:rgba(255,255,255,.08);display:flex;flex-direction:column;align-items:center;gap:4px}
.th.sel{box-shadow:inset 0 0 0 3px #ffd66b;background:rgba(255,214,107,.14)}.th.lock{opacity:.45}
.sw{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:58px}.sw i{aspect-ratio:1;border-radius:7px;box-shadow:inset 0 2px 0 rgba(255,255,255,.45)}
.th small{opacity:.8;font-size:13px}
#tip{position:absolute;left:50%;top:0;transform:translate(-50%,-6px);width:max-content;max-width:92%;padding:9px 16px;border-radius:16px;background:#fff;color:#2a1460;font:600 16px/1.3 Fredoka,system-ui,sans-serif;text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:3}
#tip.on{opacity:1;transform:translate(-50%,0)}
#hand{position:absolute;left:0;top:0;width:56px;height:56px;pointer-events:none;opacity:0;z-index:4;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
#hand.on{animation:hand 2.3s ease-in-out infinite}
@keyframes hand{0%{opacity:0;transform:translate(var(--x0),var(--y0)) scale(1)}12%{opacity:1;transform:translate(var(--x0),var(--y0)) scale(.82)}62%{opacity:1;transform:translate(var(--x1),var(--y1)) scale(.82)}78%{opacity:1;transform:translate(var(--x1),var(--y1)) scale(1)}100%{opacity:0;transform:translate(var(--x1),var(--y1)) scale(1)}}
.ver{margin:14px 0 0;font-size:13px;opacity:.45;cursor:default}
#toast{position:fixed;left:50%;bottom:calc(var(--sb) + 96px);transform:translate(-50%,20px);padding:10px 18px;border-radius:99px;background:rgba(20,12,50,.92);box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:.3s;pointer-events:none;z-index:9;white-space:nowrap;font-weight:600}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#sky,.tiles span,.node.cur{animation:none}}
</style>
</head>
<body>
<div id="sky"></div><div id="stars"></div>

<section id="home" class="screen on">
  <div class="logo">
    <div class="tiles">
      <span style="--l:#ff9eb0;--m:#ff4d6d;--d:#a3123a"></span><span style="--l:#ffe08a;--m:#ffb020;--d:#b35f00"><svg viewBox="-50 -50 100 100" width="62%"><path d="M0-46L11-11 46 0 11 11 0 46-11 11-46 0-11-11Z" fill="#fff8d6"/></svg></span><span style="--l:#a8ffd8;--m:#2ee59d;--d:#0a8a5a"></span><span style="--l:#a9cdff;--m:#3d8bff;--d:#1640a8"></span>
    </div>
    <div class="word">AURALITH</div>
    <p class="tag">Gem block puzzle under the northern lights</p>
  </div>
  <div class="menu">
    <button class="big b-j" data-a="map"><span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2l2.9 6.6 7.1.6-5.4 4.7 1.6 7.1L12 17.3 5.8 21l1.6-7.1L2 9.2l7.1-.6z"/></svg></span><span>Journey<small id="hJ">Level 1</small></span></button>
    <button class="big b-c" data-a="classic"><span class="ic"><svg viewBox="0 0 24 24" fill="#fff"><rect x="3" y="3" width="8" height="8" rx="2"/><rect x="13" y="3" width="8" height="8" rx="2" opacity=".7"/><rect x="3" y="13" width="8" height="8" rx="2" opacity=".7"/><rect x="13" y="13" width="8" height="8" rx="2"/></svg></span><span>Classic<small id="hC">Best 0</small></span></button>
    <button class="big b-d" data-a="daily"><span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M9 15l2 2 4-4"/></svg></span><span>Daily Challenge<small id="hD">New puzzle every day</small></span></button>
  </div>
  <div class="row">
    <button class="ib" data-a="howto" aria-label="How to play"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 015 .5c0 1.7-2.5 2-2.5 3.5"/><circle cx="12" cy="17" r=".6" fill="#fff"/></svg></button>
    <button class="ib" data-a="themes" aria-label="Themes"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2"><path d="M12 3a9 9 0 100 18c1.4 0 2-1 1.6-2.1-.5-1.3.4-2.4 1.8-2.4H18a3 3 0 003-3A8.6 8.6 0 0012 3z"/><circle cx="7.5" cy="11" r="1.4" fill="#ff6fa8" stroke="none"/><circle cx="10" cy="7" r="1.4" fill="#ffd66b" stroke="none"/><circle cx="14.5" cy="7" r="1.4" fill="#5affc8" stroke="none"/><circle cx="17" cy="11" r="1.4" fill="#5ab0ff" stroke="none"/></svg></button>
    <button class="ib" data-a="settings" aria-label="Settings"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg></button>
  </div>
</section>

<section id="map" class="screen">
  <div class="mhead"><button class="ib" data-a="home" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1>Journey</h1><span class="goal" id="mStars"></span></div>
  <div id="mapList"></div>
</section>

<section id="game" class="screen">
  <header class="hud">
    <button class="ib" data-a="pause" aria-label="Pause"><svg viewBox="0 0 24 24" fill="#fff"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
    <div class="sc"><div id="score">0</div><div id="sub">Best 0</div></div>
    <div class="goal" id="goal"></div>
  </header>
  <main id="stage"><canvas id="cv"></canvas><div id="praise"></div><div id="combo"></div><div id="tip"></div><div id="hand"><svg viewBox="0 0 56 56"><circle cx="22" cy="4" r="9" fill="rgba(255,255,255,.35)"/><path d="M18 6a4 4 0 018 0v17l4-.8a4 4 0 015 2.2l.6 1.2 3-.4a4 4 0 014.4 3l.4 1.4 2-.2a4 4 0 014.4 4V44c0 6-5 10-11 10H30c-4 0-7-2-9-5L12 36a4 4 0 016-5.3V6z" fill="#fff" stroke="#3a1470" stroke-width="2.6" stroke-linejoin="round"/></svg></div></main>
  <nav class="pw">
    <button class="pb" data-a="undo" id="pUndo" aria-label="Undo"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg><span class="n"></span></button>
    <button class="pb" data-a="bomb" id="pBomb" aria-label="Bomb"><svg viewBox="0 0 24 24"><circle cx="11" cy="14" r="7.5" fill="#fff"/><path d="M15.5 8.5l2-2" stroke="#fff" stroke-width="2.6" stroke-linecap="round"/><path d="M18 3.5l.6 1.6 1.6.6-1.6.6-.6 1.6-.6-1.6-1.6-.6 1.6-.6z" fill="#ffd66b"/><circle cx="8.5" cy="11.5" r="1.8" fill="#c9b8ff"/></svg><span class="n"></span></button>
    <button class="pb" data-a="shuffle" id="pShuf" aria-label="Shuffle"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7h4c4 0 6 10 10 10h4M18 14l3 3-3 3"/><path d="M3 17h4c1.6 0 2.8-1.6 3.8-3.4M13.2 9.4C14.2 8 15.4 7 17 7h4M18 4l3 3-3 3"/></svg><span class="n"></span></button>
  </nav>
</section>

<div id="ov"><div class="card" id="ovc"></div></div>
<div id="toast"></div>

<script>
{

  if(p.k==='f'){const k=1-p.life/p.max,e=k*k;const x=p.sx+(p.tx-p.sx)*e,y=p.sy+(p.ty-p.sy)*e-Math.sin(k*Math.PI)*80;star(x-p.s/2,y-p.s/2,p.s*(1-k*.4),T*3);return true}
  p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.vr)p.rot+=p.vr*dt;cx.globalAlpha=a;cx.fillStyle=p.col;
  if(p.k==='g'){cx.shadowColor=p.col;cx.shadowBlur=10;cx.beginPath();cx.arc(p.x,p.y,p.s,0,7);cx.fill();cx.shadowBlur=0}
  else{cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot);if(p.k==='c')cx.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);else{cx.beginPath();cx.moveTo(0,-p.s);cx.lineTo(p.s*.8,0);cx.lineTo(0,p.s);cx.lineTo(-p.s*.8,0);cx.closePath();cx.fill()}cx.restore()}
  cx.globalAlpha=1;return true});
 floats=floats.filter(f=>{f.t+=dt;if(f.t>1.1)return false;const k=f.t/1.1,sz=(f.big?34:26)*(f.t<.15?eob(f.t/.15):1);cx.globalAlpha=1-k*k;cx.font=`700 ${sz}px Fredoka, sans-serif`;cx.textAlign='center';cx.lineWidth=6;cx.strokeStyle='#3a1470';cx.strokeText(f.txt,f.x,f.y-k*60);cx.fillStyle=f.big?'#ffd66b':'#fff';cx.fillText(f.txt,f.x,f.y-k*60);cx.globalAlpha=1;return true});
 if(S.shown!==S.score){const d=S.score-S.shown;S.shown=Math.abs(d)<1?S.score:S.shown+d*Math.min(1,dt*10);$('#score').textContent=fmt(S.shown)}}
let last=performance.now();
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;T+=dt;if($('#game').classList.contains('on')&&S.grid&&W)draw(dt);requestAnimationFrame(frame)}
requestAnimationFrame(frame);

/* ---------- UI ---------- */
function show(id){for(const s of document.querySelectorAll('.screen'))s.classList.toggle('on',s.id===id);if(id==='home')homeInfo();if(id==='map')renderMap()}
function ov(h){$('#ovc').innerHTML=h;$('#ov').classList.add('on')}
function closeOv(){$('#ov').classList.remove('on')}
let tt;function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),1800)}
function praise(t,cls){const e=$('#praise');e.textContent=t;e.className='';void e.offsetWidth;e.className='go '+(cls||'')}
function homeInfo(){setWorld(0);document.body.classList.remove('fever');$('#hJ').textContent=P.unlocked>MAXLV?'All levels complete':'Level '+P.unlocked;$('#hC').textContent='Best '+fmt(P.best);
 const d=P.daily,done=d.last===today();$('#hD').innerHTML=(done?'Done today':'Target '+fmt(dailyTarget()))+(d.streak&&(done||d.last===yesterday())?'<span class="badge">'+d.streak+' day streak</span>':'')}
function updHud(){if(!S.grid)return;const sub=$('#sub'),g=$('#goal');
 if(S.mode==='journey'){sub.textContent='Level '+S.level+' · '+WORLDS[Math.floor((S.level-1)/20)].name;g.innerHTML=GEMSVG+(S.gemsTotal-S.gemsLeft)+'/'+S.gemsTotal}
 else if(S.mode==='daily'){sub.textContent='Daily · target '+fmt(dailyTarget());g.innerHTML=S.dailyHit?STARSVG+'Done':Math.min(99,Math.floor(S.score/dailyTarget()*100))+'%'}
 else{sub.textContent='Best '+fmt(Math.max(P.best,S.score));g.innerHTML=STARSVG+fmt(Math.max(P.best,S.score))}
 for(const [id,k] of [['#pUndo','undo'],['#pBomb','bomb'],['#pShuf','shuffle']]){const b=$(id),n=b.querySelector('.n');n.textContent=P.pw[k]>0?P.pw[k]:'+';n.classList.toggle('z',P.pw[k]<=0);b.classList.toggle('act',k==='bomb'&&S.bomb);b.classList.toggle('off',k==='undo'&&!S.undo)}
 const cb=$('#combo');cb.classList.toggle('on',S.combo>=2);cb.textContent=S.combo>=3?'AURORA FEVER · Combo x'+S.combo+' · points x2':'Combo x'+S.combo}
function renderMap(){setWorld(0);let h='',tot=0;for(const k in P.stars)tot+=P.stars[k];$('#mStars').innerHTML=STARSVG+tot;
 WORLDS.forEach((w,wi)=>{h+=`<section class="world" style="--w1:${w.c[0]};--w2:${w.c[1]}"><h2>${w.name}</h2><p>Levels ${wi*20+1}–${wi*20+20}</p><div class="lv">`;
  for(let n=wi*20+1;n<=wi*20+20;n++){const st=P.stars[n]||0,lock=n>P.unlocked;h+=`<button class="node${lock?' lock':''}${n===P.unlocked?' cur':''}" data-lv="${n}" ${lock?'disabled':''}><b>${n}</b><i>${lock?'':'★'.repeat(st)+'☆'.repeat(3-st)}</i></button>`}
  h+='</div></section>'});$('#mapList').innerHTML=h;const cur=$('.node.cur');if(cur)cur.scrollIntoView({block:'center'})}
function starsFor(){const g=S.gemsTotal,m=S.moves;const par=8+g*2+S.iceHits;return m<=par?3:m<=Math.round(par*1.6)+4?2:1}
const totalStars=()=>Object.values(P.stars).reduce((a,b)=>a+b,0);
const PWN={undo:'Undo',bomb:'Bomb',shuffle:'Shuffle'};
function levelDone(){sfx.win();confetti(120);buzz(40);const n=S.level,st=starsFor(),prev=P.stars[n]||0,before=totalStars();P.stars[n]=Math.max(prev,st);P.unlocked=Math.max(P.unlocked,n+1);const after=totalStars();
 let gift='';const hasChest=!prev&&n%5===0;if(!prev&&st===3&&!hasChest){const k=['undo','bomb','shuffle'][n%3];P.pw[k]++;gift=`<p>Perfect bonus: +1 ${PWN[k]}</p>`}save();
 const nt=THEMES.filter(t=>t.need>before&&t.need<=after);if(nt.length)setTimeout(()=>toast('New theme unlocked: '+nt[0].name+'!'),1600);
 ov(`<h2>Level ${n} clear!</h2><div class="stars">${STARSVG.repeat(3)}</div><div class="bigsc">${fmt(S.score)}</div><p>All ${S.gemsTotal} star gems freed in ${S.moves} moves</p>${gift}
 <div class="menu">${hasChest?`<button class="big b-d" data-a="chest">Open treasure chest</button>`:n<MAXLV?`<button class="big b-j" data-a="next">Next level</button>`:'<p>You finished every world!</p>'}<button class="ghost" data-a="map">Journey map</button></div>`);
 [...document.querySelectorAll('.stars svg')].forEach((s,i)=>setTimeout(()=>{if(i<st){s.classList.add('on');tone(880+i*220,.2,'triangle',.1)}},350+i*300))}
const CHEST='<svg viewBox="0 0 120 110"><g class="lid"><path d="M14 46Q60 6 106 46Z" fill="#d07a22"/><path d="M14 46Q60 14 106 46" fill="none" stroke="#ffb357" stroke-width="3"/><rect x="12" y="40" width="96" height="12" rx="3" fill="#a8551a"/><rect x="54" y="16" width="12" height="36" fill="#ffd66b"/></g><rect x="14" y="52" width="92" height="50" rx="6" fill="#b5621c"/><rect x="14" y="52" width="92" height="9" fill="#8a4512"/><rect x="54" y="52" width="12" height="50" fill="#ffd66b"/><rect x="51" y="60" width="18" height="18" rx="4" fill="#fff1b0" stroke="#b36b00" stroke-width="2.5"/><circle cx="60" cy="69" r="2.6" fill="#b36b00"/></svg>';
function chest(){const ks=['undo','bomb','shuffle'],got=[ks[Math.floor(Math.random()*3)],ks[Math.floor(Math.random()*3)],ks[Math.floor(Math.random()*3)]];got.forEach(k=>P.pw[k]++);save();
 ov(`<h2>Treasure chest!</h2><p>Tap to open</p><div class="chest" data-a="openchest">${CHEST}</div><div class="loot" id="loot"></div><div class="menu"><button class="big b-j" data-a="${S.level<MAXLV?'next':'map'}" id="cnext" style="visibility:hidden">${S.level<MAXLV?'Next level':'Journey map'}</button></div>`);
 $('#ovc').dataset.loot=got.join(',')}
function openChest(){const c=$('.chest');if(!c||c.classList.contains('shake')||c.classList.contains('open'))return;c.classList.add('shake');tone(300,.1,'square',.05);tone(340,.1,'square',.05,.15);tone(380,.1,'square',.05,.3);buzz(30);
 setTimeout(()=>{c.classList.remove('shake');c.classList.add('open');sfx.win();confetti(90);buzz(60);const got=($('#ovc').dataset.loot||'').split(',');
  $('#loot').innerHTML=got.map((k,i)=>`<span style="animation-delay:${i*.15}s">${document.querySelector({undo:'#pUndo',bomb:'#pBomb',shuffle:'#pShuf'}[k]+' svg').outerHTML}<b>+1 ${PWN[k]}</b></span>`).join('');
  $('#cnext').style.visibility='visible';const p=$('.chest').previousElementSibling;if(p)p.textContent='Your loot'},800)}
function applyTheme(){const t=THEMES[P.theme||0]||THEMES[0];PAL.splice(0,7,...t.pal);sprites={}}
function themes(){const tot=totalStars();ov(`<h2>Block themes</h2><p>You have ★ ${tot}. Earn stars in Journey to unlock more.</p><div class="ths">${THEMES.map((t,i)=>{const lock=tot<t.need,sel=(P.theme||0)===i;return `<button class="th${sel?' sel':''}${lock?' lock':''}" data-th="${i}" ${lock?'disabled':''}><span class="sw">${t.pal.slice(0,4).map(c=>`<i style="background:linear-gradient(135deg,${c[0]},${c[1]} 50%,${c[2]})"></i>`).join('')}</span><b>${t.name}</b><small>${lock?'★ '+t.need+' to unlock':sel?'In use':'Tap to use'}</small></button>`}).join('')}</div><div class="menu"><button class="big b-c" data-a="close">Done</button></div>`)}
function gameOver(){if(!S.over)return;sfx.over();let nb=false;
 if(S.mode==='classic'&&S.score>P.best){P.best=S.score;nb=true}
 if(S.mode==='daily'){if(P.daily.date!==today()){P.daily.date=today();P.daily.best=0}P.daily.best=Math.max(P.daily.best,S.score)}
 save();const canUndo=S.undo&&P.pw.undo>0;
 const extra=`${!S.revived?`<button class="big b-d" data-a="revive">Revive · clear space</button>`:''}${canUndo?`<button class="big b-c" data-a="undo">Undo last move (${P.pw.undo})</button>`:''}`;
 if(S.mode==='journey')ov(`<h2>So close!</h2><p>${S.gemsLeft} star gem${S.gemsLeft>1?'s':''} left to free</p><div class="menu">${extra}<button class="big b-j" data-a="restart">Try again</button><button class="ghost" data-a="map">Journey map</button></div>`);
 else ov(`<h2>${nb?'New best!':'Out of space'}</h2><div class="bigsc">${fmt(S.score)}</div><p>${S.mode==='daily'?(S.dailyHit?'Daily target reached':'Target '+fmt(dailyTarget())+' · best today '+fmt(P.daily.best)):'Best '+fmt(P.best)}</p><div class="menu">${extra}<button class="big b-j" data-a="restart">Play again</button><button class="ghost" data-a="home">Home</button></div>`);
 if(nb)confetti(100)}
function dailyDone(){const d=P.daily,t=today();if(d.last===t)return;d.streak=d.last===yesterday()?d.streak+1:1;d.last=t;P.pw.bomb++;save();toast('Daily done! +1 Bomb · '+d.streak+' day streak')}
const INTRO={i:['Ice!','Frozen blocks need <b>2 line clears</b>: the first cracks the ice, the second shatters the block.','ice'],
 s:['Stone!','Stone fills a line but <b>never breaks</b>. Only a Bomb can smash it. Star gems may now hide under ice too.','stone'],
 t:['Thick ice!','Extra-frozen blocks need <b>3 line clears</b>. Plan your lines carefully.','ice2']};
function obsSvg(k){const ice=`<rect x="6" y="6" width="88" height="88" rx="20" fill="url(#ig)" stroke="#fff" stroke-width="${k==='ice2'?7:4}"/><path d="M24 36L36 24M24 52L52 24" stroke="#fff" stroke-width="4" stroke-linecap="round"/>`;
 return `<svg viewBox="0 0 100 100" width="96" height="96"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${k==='stone'?'#d6d0e0':'#a9cdff'}"/><stop offset=".5" stop-color="${k==='stone'?'#8d879c':'#3d8bff'}"/><stop offset="1" stop-color="${k==='stone'?'#4a4558':'#1640a8'}"/></linearGradient><linearGradient id="ig" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="rgba(230,250,255,.8)"/><stop offset="1" stop-color="rgba(140,210,255,.45)"/></linearGradient></defs><rect x="5" y="5" width="90" height="90" rx="20" fill="url(#bg)"/>${k==='stone'?'<circle cx="32" cy="40" r="7" fill="#2a2434" opacity=".45"/><circle cx="62" cy="30" r="5" fill="#2a2434" opacity=".45"/><circle cx="56" cy="66" r="8" fill="#2a2434" opacity=".45"/>':ice}</svg>`}
function intro(w){const [t,d,k]=INTRO[w];ov(`<p style="margin:0;opacity:.7">New obstacle</p><h2>${t}</h2><div style="margin:8px 0 12px">${obsSvg(k)}</div><p>${d}</p><div class="menu"><button class="big b-j" data-a="close">Got it</button></div>`)}
function howto(){ov(`<h2>How to play</h2><ul class="how">
 <li><b>1</b><span>Drag the crystal blocks onto the board.</span></li>
 <li><b>2</b><span>Fill a whole row or column to shatter it.</span></li>
 <li><b>3</b><span>Clear lines back-to-back for a Combo. Combo x3 lights up <strong>Aurora Fever</strong> with double points.</span></li>
 <li><b>4</b><span>Journey: free every glowing star gem by clearing its row or column.</span></li>
 <li><b>5</b><span>Later worlds add obstacles: <strong>ice</strong> needs extra clears, <strong>stone</strong> breaks only with a Bomb.</span></li>
 <li><b>6</b><span>Stuck? Use Undo, Bomb (blasts 3×3) or Shuffle (new blocks).</span></li>
 <li><b>7</b><span>The game ends when none of your blocks fit.</span></li></ul>
 <div class="menu"><button class="big b-j" data-a="close">Let's play</button></div>`)}
function settings(){ov(`<h2>Settings</h2>
 <div class="set">Sound<button class="tg${P.snd?' on':''}" data-a="snd" aria-label="Sound"></button></div>
 <div class="set">Music<button class="tg${P.mus!==0?' on':''}" data-a="mus" aria-label="Music"></button></div>
 <div class="set">Vibration<button class="tg${P.vib?' on':''}" data-a="vib" aria-label="Vibration"></button></div>
 <div class="menu"><button class="big b-c" data-a="close">Done</button></div><p class="ver" data-a="ver">Auralith v1.0</p>`)}
function pause(){ov(`<h2>Paused</h2><div class="menu"><button class="big b-j" data-a="close">Resume</button><button class="big b-c" data-a="restart">Restart</button><button class="ghost" data-a="howto">How to play</button><button class="ghost" data-a="${S.mode==='journey'?'map':'home'}">${S.mode==='journey'?'Journey map':'Home'}</button></div>`)}

document.addEventListener('click',e=>{ac();musStart();const b=e.target.closest('[data-a],[data-lv],[data-th]');if(!b)return;
 if(b.dataset.th){P.theme=+b.dataset.th;applyTheme();save();sfx.click();themes();return}
 if(b.dataset.lv){sfx.click();start('journey',+b.dataset.lv);return}
 const a=b.dataset.a;if(!['undo','bomb','shuffle'].includes(a))sfx.click();
 switch(a){
  case 'map':closeOv();if(!P.tut&&P.unlocked===1&&b.closest('#home'))start('journey',1);else show('map');break;
  case 'home':closeOv();show('home');break;
  case 'classic':start('classic');break;
  case 'daily':start('daily');break;
  case 'howto':howto();break;
  case 'settings':settings();break;
  case 'pause':pause();break;
  case 'close':closeOv();break;
  case 'restart':start(S.mode,S.level);break;
  case 'next':start('journey',S.level+1);break;
  case 'themes':themes();break;
  case 'chest':chest();break;
  case 'openchest':openChest();break;
  case 'revive':revive();break; // AD HOOK: rewarded video before revive
  case 'undo':if($('#ov').classList.contains('on'))closeOv();usePow('undo');break;
  case 'bomb':usePow('bomb');break;
  case 'shuffle':usePow('shuffle');break;
  case 'snd':P.snd=P.snd?0:1;b.classList.toggle('on',!!P.snd);save();break;
  case 'mus':P.mus=P.mus===0?1:0;b.classList.toggle('on',P.mus!==0);save();if(P.mus)musStart();else musStop();break;
  case 'vib':P.vib=P.vib?0:1;b.classList.toggle('on',!!P.vib);save();buzz(20);break;
  case 'ver':P._vt=(P._vt||0)+1;if(P._vt>=7){P._vt=0;if(P.unlocked<MAXLV){P._u=P.unlocked;P.unlocked=MAXLV;toast('Test mode: all levels unlocked')}else{P.unlocked=P._u||1;toast('Test mode off')}save()}break;
  case 'unlock':if(P.unlocked<MAXLV){P._u=P.unlocked;P.unlocked=MAXLV}else{P.unlocked=P._u||1}b.classList.toggle('on',P.unlocked>=MAXLV);save();break;
 }});
applyTheme();homeInfo();
window.__lumi={get S(){return S},start,place,can,SHAPES,P,praise,confetti,updHud};
}
